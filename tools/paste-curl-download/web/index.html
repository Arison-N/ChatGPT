<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zoom-loader</title>
  <style>
    :root {
      --bg: #101216;
      --card: #1a1d24;
      --ink: #f2f4f8;
      --muted: #9aa3b2;
      --line: #2a303b;
      --accent: #4c8dff;
      --danger: #ff6b6b;
      --ok: #3dd68c;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 15px/1.45 "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }
    body { display: flex; flex-direction: column; }
    header { padding: 18px 22px 8px; }
    header h1 { margin: 0; font-size: 18px; font-weight: 650; }
    header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    main { flex: 1; padding: 8px 22px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    label { display: block; font-size: 12px; letter-spacing: .02em; color: var(--muted); margin-bottom: 6px; }
    input, textarea {
      width: 100%; background: var(--card); color: var(--ink); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px; font: inherit;
      user-select: text;
      -webkit-user-select: text;
    }
    input:focus, textarea:focus { outline: 2px solid #2e5fb8; border-color: var(--accent); }
    #name { font-size: 18px; font-weight: 600; padding: 12px 14px; }
    textarea { flex: 1; min-height: 180px; resize: none; font-family: Consolas, "Courier New", monospace; font-size: 12px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .curl-guide { font-size: 12px; color: var(--muted); margin: -2px 0 8px; }
    .chooser { display: flex; gap: 8px; align-items: stretch; }
    #dirpath {
      flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .actions { display: flex; gap: 10px; align-items: center; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 10px;
      padding: 10px 16px; font: 600 14px/1 inherit; cursor: pointer;
      user-select: none;
    }
    button.secondary { background: #2a303b; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #barwrap { height: 10px; background: #2a303b; border-radius: 99px; overflow: hidden; display: none; }
    #bar { height: 100%; width: 0; background: var(--ok); }
    #status { min-height: 1.4em; font-size: 13px; color: var(--muted); }
    #status.err { color: var(--danger); }
    #status.ok { color: var(--ok); }
  </style>
</head>
<body>
  <header>
    <h1>Download Zoom recordings</h1>
    <p>Enter custom file name and paste the Chrome Copy as cURL (bash).</p>
  </header>
  <main>
    <div>
      <label for="name">File name:</label>
      <input id="name" placeholder="yyyy-mm-dd_name_index" autocomplete="off" spellcheck="false" />
      <div class="hint" id="detected">.mp4 is added if you omit an extension.</div>
    </div>
    <div>
      <label>File saving location</label>
      <div class="chooser">
        <div id="dirpath"></div>
        <button id="browse" class="secondary" type="button">Choose folder</button>
      </div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; min-height:0;">
      <label for="paste">Chrome Copy as cURL (bash)</label>
      <div class="curl-guide">In the Network tab, right-click the MP4 → Copy → Copy as cURL (bash), then Ctrl+V.</div>
      <textarea id="paste"></textarea>
    </div>
    <div class="actions">
      <button id="dl" type="button">Download</button>
      <button id="clear" class="secondary" type="button">Clear</button>
    </div>
    <div id="barwrap"><div id="bar"></div></div>
    <div id="status"></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let destDir = "";
    let detectedName = "";

    const editable = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA");
    document.addEventListener("copy", (e) => { if (!editable(e.target)) e.preventDefault(); });
    document.addEventListener("cut", (e) => { if (!editable(e.target)) e.preventDefault(); });
    document.addEventListener("selectstart", (e) => { if (!editable(e.target)) e.preventDefault(); });
    document.addEventListener("contextmenu", (e) => { if (!editable(e.target)) e.preventDefault(); });
    document.addEventListener("dragstart", (e) => { if (!editable(e.target)) e.preventDefault(); });

    function setDir(path) {
      destDir = path || "";
      $("dirpath").textContent = destDir;
      $("dirpath").title = destDir;
    }

    fetch("/api/defaults").then(r => r.json()).then(d => { setDir(d.downloadDir || ""); });

    $("browse").onclick = async () => {
      const r = await fetch("/api/pick-folder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ current: destDir })
      });
      const data = await r.json();
      if (data.path) setDir(data.path);
    };

    async function parsePaste() {
      const paste = $("paste").value;
      if (!paste.includes("https://")) return;
      const r = await fetch("/api/parse", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ paste })
      });
      const data = await r.json();
      if (!r.ok) {
        $("detected").textContent = data.error || "Could not parse cURL.";
        return;
      }
      detectedName = data.filename || "";
      $("detected").textContent = detectedName
        ? ("Detected original name: " + detectedName)
        : ".mp4 is added if you omit an extension.";
    }

    let parseTimer;
    $("paste").addEventListener("input", () => {
      clearTimeout(parseTimer);
      parseTimer = setTimeout(parsePaste, 250);
    });

    $("clear").onclick = () => {
      $("paste").value = "";
      $("name").value = "";
      detectedName = "";
      $("detected").textContent = ".mp4 is added if you omit an extension.";
      $("status").textContent = "";
      $("status").className = "";
      $("barwrap").style.display = "none";
      $("bar").style.width = "0";
    };

    function fmt(n) {
      if (!n || n < 0) return "?";
      if (n < 1024) return n + " B";
      if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
      if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
      return (n / 1073741824).toFixed(2) + " GB";
    }

    $("dl").onclick = async () => {
      $("status").className = "";
      $("status").textContent = "Downloading…";
      $("dl").disabled = true;
      $("barwrap").style.display = "block";
      $("bar").style.width = "0";
      try {
        const r = await fetch("/api/download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            paste: $("paste").value,
            filename: $("name").value,
            destDir
          })
        });
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            const ev = JSON.parse(line);
            if (ev.type === "progress") {
              const pct = ev.total > 0 ? Math.min(100, (ev.written / ev.total) * 100) : 0;
              $("bar").style.width = pct + "%";
              $("status").textContent = fmt(ev.written) + (ev.total > 0 ? " / " + fmt(ev.total) : "");
            } else if (ev.type === "done") {
              $("bar").style.width = "100%";
              $("status").className = "ok";
              $("status").textContent = "Saved " + ev.path + " (" + fmt(ev.bytes) + ")";
              if (ev.bytes < 5000000) {
                $("status").textContent += "  Note: file is under 5 MB; long recordings are usually much larger.";
              }
            } else if (ev.type === "error") {
              $("status").className = "err";
              $("status").textContent = ev.message;
            }
          }
        }
      } catch (e) {
        $("status").className = "err";
        $("status").textContent = String(e);
      } finally {
        $("dl").disabled = false;
      }
    };

    window.addEventListener("pagehide", () => {
      navigator.sendBeacon("/api/shutdown");
    });
  </script>
</body>
</html>
